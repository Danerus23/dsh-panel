# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json
#
# DSH Panel — version manifest for the Windows Package Manager community repository.
# Comments are in English because these files are submitted verbatim to
# microsoft/winget-pkgs, where the pull request is read in English.
#
# PackageVersion, the installer hash and ReleaseDate are filled in by tools\winget-manifest.ps1
# (offline, idempotent: the version comes from DshPanel.csproj, the hash from SHA256SUMS.txt):
#
#   pwsh -NoProfile -File .\tools\winget-manifest.ps1 -Sums .\upd-build\dist-next\SHA256SUMS.txt -ReleaseDate 2026-10-17
#
# Take the hash from the release build's SHA256SUMS.txt, not from a local rebuild: the bytes of
# a rebuild differ from the bytes that were signed off for the release (docs\RELEASE-V2.md §3.11).

PackageIdentifier: Danerus23.DSHPanel
PackageVersion: 2.4.2
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.12.0
