# Кнопка «Sponsor» на странице репозитория.
#
# GitHub здесь денег не касается: он только показывает ссылку, а сбор идёт на стороне сервиса.
# Поэтому внутренняя программа GitHub Sponsors нам не подходит — её выплаты недоступны
# получателям из России (страна не входит в список поддерживаемых при подключении сбора), —
# а вот готовая ссылка на lava.top работает и стоит тут.
#
# Ключ keys: `custom` принимает до четырёх адресов. Если появится Patreon, с которого деньги
# действительно доходят, его можно добавить сюда же (или ключом `patreon`).
custom: ["https://app.lava.top/3686297587"]
