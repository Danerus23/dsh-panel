# Сборка и выпуск панели DSH Panel 2.0. Запускается на каждый push в main и на pull request;
# выпуск собирается только по тегу вида v2.0.0.
#
# **Почему сборка идёт ИМЕННО ТЕМИ скриптами, что и на машине.** Артефакт из CI обязан совпадать
# с тем, что проверили локально: другой способ сборки означал бы, что у людей лежит сборка,
# которой никто не видел. Поэтому здесь нет своей логики публикации — только вызовы:
#   * `dotnet publish` тем же профилем (`win-x64`, один exe);
#   * `installer\build-installer.ps1` — установщик;
#   * `tools\check-personal.ps1`, `tools\check-encoding.ps1`, `tools\check-dictionaries.ps1` —
#     сторожа выпуска. **Их в 1.x не было в CI для 2.0, и это ровно та дыра, из-за которой
#     личные данные могли уехать в публичный репозиторий.**
#
# ⚠️ **Экшены закреплены по SHA коммита, а не по мажорному тегу.** Тег `@v4` владелец чужого
# репозитория может переставить в любой момент, и тогда изменится код, который выполняется здесь.
# Обновлять осознанно:
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
# (у аннотированных тегов нужен ещё шаг: git/tags/<sha> → .object.sha)
#
# ⚠️ **Чего этот конвейер НЕ проверяет и не может:** установку на чистую систему, установку
# поверх работающей панели и снятие через «Программы и компоненты». Это смотрит человек
# в виртуальной машине (docs\RELEASE-V2.md), и подменять это зелёным CI нельзя.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Права только на чтение: их хватает сборке и pull request.
# Право на запись выдаётся отдельно — job'у выпуска.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-dotnet v4.3.1
      - name: Установить .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Сторож личных данных
        shell: pwsh
        run: ./tools/check-personal.ps1

      - name: Сторож кодировки
        shell: pwsh
        run: ./tools/check-encoding.ps1

      - name: Сверка словарей по смыслу
        shell: pwsh
        run: ./tools/check-dictionaries.ps1

      - name: Восстановить пакеты по замкам
        shell: pwsh
        run: dotnet restore DshPanel.slnx --locked-mode

      # Предупреждения = ошибки сборки: панель раздаётся людям, и «одно предупреждение» в CI
      # означает, что его не увидит никто.
      - name: Собрать
        shell: pwsh
        run: dotnet build DshPanel.slnx -c Release --no-restore

      - name: Прогон проверок без экрана
        shell: pwsh
        run: dotnet test tests/DshPanel.Tests/DshPanel.Tests.csproj -c Release --no-build

      # Раздатка для выпуска: один exe (среда .NET внутри, ставить её не нужно).
      # ⚠️ ПРОГОН ВРУЧНУЮ (workflow_dispatch) СОБИРАЕТ ВСЮ ВЫПУСКНУЮ ЧАСТЬ, КРОМЕ САМОГО ВЫПУСКА.
      # Так проверяют шаг установщика ДО тега. Причина — 30.09.2026: установщик сломался на
      # компиляторе (в Inno Setup 6 нет китайского языка; раннер ставит семёрку туда, где её
      # искали не первым), и CI узнал об этом только на теге — выпуск пришлось собирать руками.
      # Job release ниже по-прежнему запускается ТОЛЬКО по тегу: прогон вручную ничего не публикует.
      - name: Опубликовать панель (один exe)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: dotnet publish src/DshPanel/DshPanel.csproj -c Release -p:PublishProfile=win-x64 -o dist

      # Установщик нужен в выпуске: панель качает dsh-panel-setup.exe как часть комплекта.
      - name: Установить Inno Setup 7
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($iscc) { Write-Host "Inno Setup 7 уже есть: $iscc"; exit 0 }

          # Ссылка версионная и постоянная: файл на GitHub Releases не меняется.
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup7.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait

          $installed = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $installed) { throw 'Inno Setup 7 не установился' }
          Write-Host "Inno Setup 7 установлен: $installed"

      # Версия берётся из единственного места (DshPanel.csproj) — скрипт читает её сам.
      - name: Собрать установщик
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./installer/build-installer.ps1 -SkipBuild

      # Архив раздатки: панель — один exe, но комплект «распаковал и запустил» людям нужен.
      # Имя архива — как у 1.x: оно жёстко зашито в инструментах winget и в панели.
      - name: Собрать архив
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zip = Join-Path (Get-Location) 'dist/DshPanel.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'dist/DshPanel.exe' -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | ForEach-Object { Write-Host ("архив: {0:N1} МБ" -f ($_.Length / 1MB)) }

      # Файл сумм: панель сверяет по нему скачанное, и формат у него свой —
      # «хэш, два пробела, имя файла», UTF-8 БЕЗ BOM (с BOM первый хэш перестал бы быть хэшем).
      - name: Записать контрольные суммы
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $names = @('dsh-panel-setup.exe', 'DshPanel.zip')
          $lines = foreach ($name in $names) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path)) { throw "в выпуске нет файла: $name" }
            (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $name
          }
          $out = Join-Path (Get-Location) 'dist/SHA256SUMS.txt'
          [IO.File]::WriteAllLines($out, $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content $out

      # ОПИСАНИЕ ВЫПУСКА — на трёх языках, с машинными метками `<!-- dsh-notes:xx -->`: только их
      # разбирает панель, показывая человеку заметки на ЕГО языке (`Update\UpdateDecisions.PickNotes`).
      # ⚠️ Раньше здесь стояло `--generate-notes`: это английский текст GitHub без меток, и панель
      # показала бы его на всех трёх языках. Дыру не было видно, пока выпуски собирались руками
      # (описание к ним ставили вручную) — 30.09.2026 выпускную часть впервые прогнали в конвейере.
      # ⚠️ Версию инструмент берёт сам из `src/DshPanel/DshPanel.csproj` (как установщик), а НЕ из
      # `github.ref_name`: прогон вручную идёт с ветки, и `ref_name` там — `main` (на этом ручной
      # прогон 36663614401 и упал: искался раздел `## main`).
      - name: Собрать описание выпуска (три языка)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./tools/release-notes.ps1 -Out dist/release-notes.md

      - name: Сохранить файлы выпуска
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-files
          path: |
            dist/dsh-panel-setup.exe
            dist/DshPanel.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md

  # Выпуск создаётся ТОЛЬКО по тегу: до тега файлы лежат артефактом и никому не видны.
  # ⚠️ Публикация выпуска — это то, что владелец разрешает отдельно (docs\RELEASE-V2.md §6):
  # тег ставится после его слова, и до этого job не запускается вовсе.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Забрать файлы выпуска
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Создать выпуск
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # Описание — файл, собранный шагом «Собрать описание выпуска (три языка)» из трёх
          # CHANGELOG: три размеченных блока `<!-- dsh-notes:xx -->`. Заголовок выпуска — `$tag`,
          # а внутри лежит имя версии без «v» (метка `v2.0.1` → разделы `## 2.0.1`).
          gh release create $tag `
            'release-files/dsh-panel-setup.exe' `
            'release-files/DshPanel.zip' `
            'release-files/SHA256SUMS.txt' `
            --title "DSH Panel $tag" `
            --notes-file 'release-files/release-notes.md'
